
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">

        <div class="header">
            <h1>Calculator</h1>
            <button class="refresh-button" onclick="clearCalculator()" title="Clear">↻</button>
        </div>

        <div class="display" id="display">0</div>

        <div class="buttons">
            <button class="operator" onclick="chooseOperator('/')">÷</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button onclick="appendNumber('4')">4</button>

            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>

            <button onclick="appendNumber('3')">3</button>
            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>

            <button class="equals" onclick="calculateResult()">=</button>
        </div>

        <p class="message" id="message">Ready to calculate</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
